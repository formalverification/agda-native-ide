# File: .github/workflows/app.yml
#
# Changed from upstream: this is SeungheonOh/plfa-playground's
# .github/workflows/ci.yml at ae0aa84c24363a8d6dadc292b6eb8f88f7f38705
# (docs/provenance.md).  The app's binaries are pinned by hash rather than
# committed, so the job installs Nix, materializes them (`make assets`),
# and builds with `make build`, which checks them first; node is the dev
# shell's 22.22.2 rather than setup-node's; it runs on pushes to main, not
# master; and the deploy job (a Cloudflare wrangler-action with upstream's
# secrets) is removed, since hosting is issue 6.  Issue 5 replaces this
# workflow.

name: app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v27
      - run: nix develop --command make assets
      - run: nix develop --command npm ci
      - run: nix develop --command npm run check
      - run: nix develop --command npm test
      - run: nix develop --command make build
