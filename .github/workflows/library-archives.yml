# File: .github/workflows/library-archives.yml
#
# agda-algebras' archives (issue 12): its interfaces built by the
# compiler's plain agda under wasmtime, packed and indexed, and every root
# checked cold from the archives the index names
# (docs/notes/library-archives.md), with the interfaces built a second
# time to prove the bytes reproduce.  The sizes, the check's counts and the build's time and memory go to the
# step summary; the index, the summary and the check's report are
# uploaded.  The archives themselves are not: nothing ships them until the
# page mounts them (issue 14), and `nix build .#agda-algebras-archives`
# rebuilds them from the pins.
#
# It runs on demand, and when a push to main or a pull request changes
# what the archives are built from: the flake (the pins of agda-algebras,
# the compiler, the standard library and wasmtime), the standard library's
# patches, the compiler's hashes, the scripts, or this file; or what the
# gate is made of (below).  The runner's memory is logged every two
# minutes: wasmtime compiles the 34 MB agda.wasm once per derivation, at
# about 4.3 GiB, on a runner with 15.6 GiB and 4 cores since the
# repository went public (7.8 GiB and 2 cores before).
#
# What it costs: measured 2026-10-11 on a 2-core runner, while the
# repository was private (7.8 GiB, 3 GiB of swap, none of it used; run
# 38153481044), 58 minutes: the interfaces with their inputs 13.7, again
# with --rebuild 12.1, the archives 0.1, and the check of every root, two
# at once, 31.5.  Nearly every change touches flake.nix, so the job first
# evaluates the check's derivation at the base (the pull request's base,
# or the commit before a push) and at the head, which takes seconds, and
# builds nothing when the two are the same derivation, this file is
# unchanged and so is the gate's code (below): that derivation is the one
# the base proved.
#
# The public formalverification Cachix cache, which agda-algebras' CI
# also uses, is read on every run, so a derivation built before is
# fetched rather than built; its write token, CACHIX_AUTH_TOKEN, reaches
# the action only on main, since a pull request's run executes what the
# pull request changed.  The second build is never fetched: --rebuild
# builds again here and compares with what the first build gave, built or
# fetched.
#
# Then the gate (issue 13): the same roots under the language server the
# site ships, its reactor, in headless Chromium (`make library-gate`), each
# in a fresh session with only the archives the index names for it, which
# must type-check Main alone, and the two controls, which must not.  It
# runs every root wherever it runs, when the archives' derivation changed
# or what the gate is made of did: its app (`nix run .#library-gate`,
# whose store path holds its scripts, the DevTools driver and the server
# it shares with the browser check, and the node and Chromium it pins),
# which the guard compares with the base's as it compares the derivation;
# and, by a diff against the base, the engine's core and browser transport
# (the drive, and the session that counts the Checking lines), the gate's
# page, the lockfile, which pins the drive's dependencies, and the
# Makefile, whose library-gate target CI runs.  The site is
# `nix build .#site`.  When only the gate changed, the archives come from
# the cache once main's runs push them; until the write token reaches the
# action, main pushes nothing, and they are built again, without the
# --rebuild (the interfaces took 6.5 to 12.7 minutes in four runs on a
# 4-core runner on 2026-10-12).
#
# What the gate costs, measured 2026-10-12
# (docs/measurements/library-archives-browser-2026-10-12.json): on a
# 4-core runner, every root four at once in 16.5 to 23.4 minutes, its step
# with `npm ci` and the page's build 17.3 to 23.9, in jobs of 49 to 66
# minutes from the interfaces to the gate (runs 38209105006, dispatched
# on issue 13's branch, 38213187621 and 38243413321); on a 20-core
# workstation shared with other work, 12.8 minutes.  One session per job,
# checking its roots in turn, took 85 s there, but proves less
# (docs/notes/library-archives.md).

name: library-archives

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - Makefile
      - stdlib/patches/**
      - compiler/agda-2.9.0.sha256
      - scripts/library-archives/**
      - packages/engine/src/core/**
      - packages/engine/src/browser/**
      - packages/engine/package.json
      - packages/engine/tsconfig.json
      - packages/tsconfig.base.json
      - scripts/browser-check/cdp.mjs
      - scripts/browser-check/serve.mjs
      - package-lock.json
      - .github/workflows/library-archives.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - Makefile
      - stdlib/patches/**
      - compiler/agda-2.9.0.sha256
      - scripts/library-archives/**
      - packages/engine/src/core/**
      - packages/engine/src/browser/**
      - packages/engine/package.json
      - packages/engine/tsconfig.json
      - packages/tsconfig.base.json
      - scripts/browser-check/cdp.mjs
      - scripts/browser-check/serve.mjs
      - package-lock.json
      - .github/workflows/library-archives.yml

permissions:
  contents: read

# A newer run cancels one in progress on a pull request, but never on
# main: a later push's guard compares against the commit before it, so
# that commit's run must finish.
concurrency:
  group: library-archives-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  archives:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v27
      - uses: cachix/cachix-action@v17
        with:
          name: formalverification
          authToken: ${{ github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.ref != 'refs/heads/main' }}
          # Not what the flake fetches by hash from GitHub anyway: the
          # compiler's files and the sources' tarballs.  Nor the site and
          # its npm dependencies, which the gate builds, and site.yml
          # builds again without the cache.
          pushFilter: '(-source|-agda\.wasm|-als\.wasm|-als-reactor\.wasm|-als-reactor\.js|-agda-2\.9\.0-compiler|-agda-native-ide-site|-agda-native-ide-npm-deps)$'
      - name: Decide whether the archives' derivation changed, or the gate's code
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          head=$(nix eval --raw .#agda-algebras-check.drvPath)
          gate_app=apps.x86_64-linux.library-gate.program
          gate_head=$(nix eval --raw ".#$gate_app")
          base=none
          gate_base=none
          if [ "$EVENT" != workflow_dispatch ] && [ -n "$BASE" ] \
              && git fetch -q --depth=1 origin "$BASE" 2> /dev/null; then
            base=$(nix eval --raw "git+file://$PWD?rev=$BASE&shallow=1#agda-algebras-check.drvPath" 2> /dev/null) \
              || base=none
            gate_base=$(nix eval --raw "git+file://$PWD?rev=$BASE&shallow=1#$gate_app" 2> /dev/null) \
              || gate_base=none
          fi
          echo "head: $head"
          echo "base ($BASE): $base"
          if [ "$head" = "$base" ] \
              && git diff --quiet "$BASE" HEAD -- .github/workflows/library-archives.yml; then
            echo "The archives' derivation is the base's, $head: nothing to build." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo build=false >> "$GITHUB_OUTPUT"
            # The gate runs again only if what it is made of changed: its
            # app (its scripts, node and Chromium, as flake.nix pins them),
            # or the files the app does not carry.
            echo "gate app: head $gate_head, base $gate_base"
            if [ "$gate_head" = "$gate_base" ] && git diff --quiet "$BASE" HEAD -- \
                packages/engine/src/core packages/engine/src/browser \
                packages/engine/package.json packages/engine/tsconfig.json \
                packages/tsconfig.base.json scripts/library-archives/gate \
                package-lock.json Makefile; then
              echo "Nor did the gate's code change: no gate." | tee -a "$GITHUB_STEP_SUMMARY"
              echo gate=false >> "$GITHUB_OUTPUT"
            else
              echo gate=true >> "$GITHUB_OUTPUT"
            fi
          else
            echo build=true >> "$GITHUB_OUTPUT"
            echo gate=true >> "$GITHUB_OUTPUT"
          fi
      - name: Say what the runner has
        if: steps.changed.outputs.gate == 'true'
        run: |
          nproc
          free -h
          df -h / || true
      - name: Build the interfaces
        if: steps.changed.outputs.build == 'true'
        run: |
          (while sleep 120; do
            free -m | awk 'NR == 2 { m = $3 " of " $2 } NR == 3 { print "== memory: " m " MiB used, swap " $3 " of " $2 " MiB" }'
          done) &
          trap 'kill $! 2> /dev/null || true' EXIT
          nix build .#agda-algebras-interfaces --print-build-logs
      - name: Build them again, and fail if a byte differs
        id: rebuild
        if: steps.changed.outputs.build == 'true'
        run: nix build .#agda-algebras-interfaces --rebuild --keep-failed
      - name: Say what differed
        if: failure() && steps.rebuild.outcome == 'failure'
        run: |
          out=$(nix path-info .#agda-algebras-interfaces)
          diff -r "$out" "$out.check" | head -200 || true
      - name: Pack the archives and write the index
        if: steps.changed.outputs.build == 'true'
        run: |
          nix build .#agda-algebras-archives --print-build-logs
          nix build .#agda-algebras-archives --rebuild
      - name: Check every root from the archives the index names
        if: steps.changed.outputs.build == 'true'
        run: |
          (while sleep 120; do
            free -m | awk 'NR == 2 { m = $3 " of " $2 } NR == 3 { print "== memory: " m " MiB used, swap " $3 " of " $2 " MiB" }'
          done) &
          trap 'kill $! 2> /dev/null || true' EXIT
          nix build .#agda-algebras-check --print-build-logs
      - name: Record the sizes, the counts, and the build's time and memory
        if: always() && steps.changed.outputs.build == 'true'
        run: |
          archives=$(nix path-info .#agda-algebras-archives 2> /dev/null) || exit 0
          mkdir -p records
          cp "$archives/index.json" "$archives/summary.md" records/
          {
            echo "### agda-algebras' archives"
            echo
            cat "$archives/summary.md"
            echo
            echo '```'
            nix log .#agda-algebras-interfaces | grep -E '^build: |Elapsed|Maximum resident|total memory in use' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if check=$(nix path-info .#agda-algebras-check 2> /dev/null); then
            cp "$check/report.txt" records/
            nix log .#agda-algebras-check > records/check.log || true
            {
              echo
              echo "The check: $(awk 'NR > 1 && $1 !~ /^control:/ && $2 == 0 && $3 == 1' "$check/report.txt" | wc -l) of $(awk 'NR > 1 && $1 !~ /^control:/' "$check/report.txt" | wc -l) roots type-checked Main alone; the controls:"
              echo
              echo '```'
              grep '^control:' "$check/report.txt"
              grep -E '^check: (done|[0-9]+ of)' records/check.log || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build the site, whose language server the gate runs
        if: steps.changed.outputs.gate == 'true'
        run: nix build .#site --out-link site --print-build-logs
      - name: Check every root under the site's language server, in headless Chromium
        if: steps.changed.outputs.gate == 'true'
        run: |
          (while sleep 120; do
            free -m | awk 'NR == 2 { m = $3 " of " $2 } NR == 3 { print "== memory: " m " MiB used, swap " $3 " of " $2 " MiB" }'
          done) &
          trap 'kill $! 2> /dev/null || true' EXIT
          archives=$(nix build .#agda-algebras-archives --no-link --print-out-paths)
          mkdir -p records
          nix develop --command make library-gate SITE=site ARCHIVES="$archives" \
            LIBRARY_GATE=records/gate GATE_ARGS="--jobs $(nproc)" 2>&1 | tee records/gate.log
          exit "${PIPESTATUS[0]}"
      - name: Record the gate's counts and time
        if: always() && steps.changed.outputs.gate == 'true'
        run: |
          [ -f records/gate/report.json ] || exit 0
          {
            echo
            echo "### The gate, under the site's language server"
            echo
            echo '```'
            grep -E '^gate: ' records/gate.log || true
            echo '```'
            echo
            jq -r '.totals | "Seconds summed over the roots: start \(.seconds.start), mount \(.seconds.mount), load \(.seconds.load); the slowest load \(.slowest[0].root) \(.slowest[0].loadSeconds) s; the largest heap \(.largestMemory[0].root) \(.largestMemory[0].memoryBytes) bytes."' records/gate/report.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.changed.outputs.gate == 'true'
        with:
          name: library-archives
          path: records
          if-no-files-found: warn
      - name: Disk usage after the build
        if: always() && steps.changed.outputs.gate == 'true'
        run: df -h / || true
