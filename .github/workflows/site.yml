# File: .github/workflows/site.yml
#
# The site's CI (issue 5), on every pull request and every push to main,
# in the following jobs:
#
#   build    `nix build .#site`, then the same build again with --rebuild,
#            which fails if a byte differs (and then uploads what
#            differed); it records the output's NAR hash and uploads the
#            site for the browser job.  The site carries agda-algebras'
#            archives (issue 14), so its build depends on their
#            interfaces' (10 to 14 minutes on a runner): it reads the
#            formalverification Cachix cache and writes nothing to it.
#            library-archives.yml fills that cache from main (since
#            2026-10-13, when CACHIX_AUTH_TOKEN reached it), so a run
#            fetches the interfaces when main has built the same
#            derivation, and builds them otherwise;
#   test     the unit tests (vitest) and svelte-check, in the dev shell;
#   browser  the built site checked in headless Chromium (`nix run
#            .#browser-check`), served without the isolation headers, which
#            the page no longer needs (issue 59), and again with them: Agda
#            ready, the first check of Main.agda and the modules it
#            type-checked, a give, and a type error at its position, with
#            crossOriginIsolated as the server made it; then the page's
#            notices (`nix run .#browser-check-notices`): a browser without
#            DecompressionStream, a compiler request that fails, a compiler
#            that does not decompress, and an archive whose transfer breaks
#            off (issue 8), and three after Agda has started: an archive
#            not found, an archive that is not its digest's, and the index
#            not found (issue 14); the engine's conformance suite against
#            the built site's reactor (`make conformance-browser`, issue
#            62); and the manifest package's tests over the built site's
#            whole archive index, whose plan must be index.mjs's for every
#            root (issue 14).  The timings, records and screenshots are
#            uploaded.
#
# It replaces upstream's workflow (imported as app.yml), whose npm steps
# are `make test` and `make check` here, and whose build is the Nix
# package's.  ci.yml lints the plan, and its `nix` job belongs to the
# engine's repository.

name: site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v27
      # Read only: agda-algebras' interfaces, which the site's archives are
      # packed from, are fetched when main's archives job has pushed them
      # (it has since 2026-10-13), and built here otherwise.
      - uses: cachix/cachix-action@v17
        with:
          name: formalverification
          skipPush: true
      - name: Build the site
        run: nix build .#site --print-build-logs
      - name: Build it again, and fail if a byte differs
        id: rebuild
        run: nix build .#site --rebuild --keep-failed
      - name: Say what differed
        if: failure() && steps.rebuild.outcome == 'failure'
        run: |
          out=$(nix path-info .#site)
          mkdir -p nondeterminism
          diff -r "$out" "$out.check" > nondeterminism/diff.txt || true
          head -200 nondeterminism/diff.txt
          cp -R --no-preserve=mode,ownership "$out.check" nondeterminism/check
      - uses: actions/upload-artifact@v6
        if: failure() && steps.rebuild.outcome == 'failure'
        with:
          name: nondeterminism
          path: nondeterminism
      - name: Record what was built
        run: |
          {
            echo "### The site"
            echo
            echo "Revision $(git rev-parse HEAD), $(find -L result -type f | wc -l) files"
            echo
            echo '```'
            nix path-info --json .#site
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          nix path-info --json .#site
      - name: Copy the site out of the store
        run: cp -R --no-preserve=mode,ownership result/. site
      - uses: actions/upload-artifact@v6
        with:
          name: site
          path: site
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v27
      - name: Unit tests
        run: nix develop --command make test
      - name: svelte-check
        run: nix develop --command make check

  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v27
      - uses: actions/download-artifact@v7
        with:
          name: site
          path: site
      - name: Check Main.agda in headless Chromium, served without the isolation headers
        run: nix run .#browser-check -- site --out browser-check
      - name: Check Main.agda in headless Chromium, served with the isolation headers
        if: ${{ !cancelled() }}
        run: nix run .#browser-check -- site --isolated --out browser-check/isolated
      - name: Check the page's notices in headless Chromium
        if: ${{ !cancelled() }}
        run: nix run .#browser-check-notices -- site --out browser-check/notices
      - name: Run the engine's conformance suite in headless Chromium, against the site's reactor
        if: ${{ !cancelled() }}
        run: nix develop --command make conformance-browser SITE=site CONFORMANCE=conformance
      - name: Plan every root of the built site's archive index as index.mjs does
        if: ${{ !cancelled() }}
        run: |
          nix develop --command bash -c \
            "make packages && AGDA_ALGEBRAS_INDEX=$PWD/site/agda-algebras/index.json npx vitest run packages/manifest"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-check
          path: browser-check
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: conformance-browser
          path: conformance
          if-no-files-found: error
